name: Normalize package lock metadata

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/normalize-package-lock.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Normalize package identity in lockfile
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.name = 'shopping-cart';
          if (lock.packages && lock.packages['']) {
            lock.packages[''].name = 'shopping-cart';
          }
          fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`);
          NODE

      - name: Commit normalized lockfile and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/normalize-package-lock.yml
          git add package-lock.json
          git commit -m "Sync Shopping Cart package lock metadata"
          git push origin master
